<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Container Historie</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-primary" th:text="'Historie: ' + ${containerName}">Container Logs</h2>
        <a href="/dashboard" class="btn btn-secondary">⬅ Zurück zum Dashboard</a>
    </div>

    <div class="card shadow">
        <div class="card-body">
            <table class="table table-striped table-sm">
                <thead class="table-dark">
                <tr>
                    <th>Zeitstempel</th>
                    <th>Status</th>
                    <th>CPU %</th>
                    <th>RAM (MB)</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="log : ${logListe}">
                    <td th:text="${#temporals.format(log.loggedAt, 'dd.MM.yyyy HH:mm:ss')}">Datum</td>
                    <td>
                                <span th:class="${log.status == 'running'} ? 'badge bg-success' : 'badge bg-danger'"
                                      th:text="${log.status}">Status</span>
                    </td>
                    <td th:text="${#numbers.formatDecimal(log.cpuPercent, 1, 2)} + ' %'">CPU</td>
                    <td th:text="${#numbers.formatDecimal(log.memoryUsageMb, 1, 2)} + ' MB'">RAM</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
